# Copier ce fichier en 01-secrets.local.yaml, remplir les valeurs réelles,
# puis `kubectl apply -f 01-secrets.local.yaml`. Ne JAMAIS committer le
# fichier rempli — 01-secrets.local.yaml est exclu via .gitignore.
apiVersion: v1
kind: Secret
metadata:
  name: rogweb-secrets
  namespace: god-rogwebservice
type: Opaque
stringData:
  POSTGRES_DB: god_rogwebservice
  POSTGRES_USER: rogweb
  POSTGRES_PASSWORD: "REMPLACER_PAR_UN_MOT_DE_PASSE_FORT"
  JWT_SECRET: "REMPLACER_PAR_UNE_CLE_SECRETE_ALEATOIRE"
  GEMINI_API_KEY: ""
