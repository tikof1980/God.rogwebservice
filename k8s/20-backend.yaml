apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: god-rogwebservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Remplacer par l'image poussée sur votre registre
          # (ex: ghcr.io/tikof1980/god-rogwebservice-backend:latest)
          image: god-rogwebservice-backend:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: DB_TYPE
              value: "postgres"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
          envFrom:
            - secretRef:
                name: rogweb-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/auth/login
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
            # 401/404 attendu sans body — signifie simplement que le
            # serveur répond ; c'est suffisant pour la readiness.
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: god-rogwebservice
spec:
  selector:
    app: backend
  ports:
    - port: 3001
      targetPort: 3001

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: god-rogwebservice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
